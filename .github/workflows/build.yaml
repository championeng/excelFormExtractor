# https://github.com/tuananh/py-event-ruler/blob/main/.github/workflows/publish.yml
name: Build and publish Python wheels
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - v*
env:
  PY_COLORS: "1"
  GOTRACEBACK: crash
  GO111MODULE: auto

jobs:
  build_linux_x86_64:
    name: Linux 3.14 x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: copy setup.py
        run: cp setup_ci.py setup.py

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=0.3.41.dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp314-manylinux_x86_64"
          CIBW_SKIP: "*-musllinux_x86_64"
          CIBW_ARCHS: "native"
          CIBW_ENVIRONMENT: "PATH=$PATH:/usr/local/go/bin RELEASE_VERSION=${RELEASE_VERSION}"
          CIBW_ENVIRONMENT_PASS_LINUX: "RELEASE_VERSION"
          CIBW_TEST_COMMAND: >-
            python -c "from py_excel_form_extractor import extractor, utils;
            assert extractor.CellRange(); assert extractor.SearchCriteria()"
          CIBW_BEFORE_BUILD: |
            pip install pybindgen
          CIBW_BEFORE_ALL_LINUX: |
            curl -o go.tar.gz https://dl.google.com/go/go1.22.9.linux-amd64.tar.gz
            tar -C /usr/local -xzf go.tar.gz
            go install github.com/go-python/gopy@v0.4.10
            go install golang.org/x/tools/cmd/goimports@v0.16.0
          # CIBW_BUILD_VERBOSITY: 3 # Add verbose output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-amd64
          path: ./wheelhouse/*.whl

  build_linux_arm:
    name: Linux 3.14 aarch64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: copy setup.py
        run: cp setup_ci.py setup.py

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=0.3.41.dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp314-manylinux_aarch64"
          CIBW_ARCHS: "aarch64"
          CIBW_ENVIRONMENT: "PATH=$PATH:/usr/local/go/bin RELEASE_VERSION=${RELEASE_VERSION}"
          CIBW_ENVIRONMENT_PASS_LINUX: "RELEASE_VERSION"
          CIBW_TEST_COMMAND: >-
            python -c "from py_excel_form_extractor import extractor, utils;
            assert extractor.CellRange(); assert extractor.SearchCriteria()"
          CIBW_BEFORE_BUILD: |
            pip install pybindgen
          CIBW_BEFORE_ALL_LINUX: |
            curl -o go.tar.gz https://dl.google.com/go/go1.22.7.linux-arm64.tar.gz
            tar -C /usr/local -xzf go.tar.gz
            go install github.com/go-python/gopy@v0.4.10
            go install golang.org/x/tools/cmd/goimports@v0.16.0
          # CIBW_BUILD_VERBOSITY: 3 # Add verbose output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm
          path: ./wheelhouse/*.whl

  build_macos_arm:
    name: macOS 3.14 arm64
    runs-on: macos-14 # macOS 14 runs on Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-go@v6
        with:
          # gopy 0.4.10 pins x/tools 0.16.0, which does not compile on Go 1.24+.
          go-version: "1.23.x"

      - name: copy setup.py
        run: cp setup_ci.py setup.py

      - name: Set Release Version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=0.3.41.dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install Go build tools
        run: |
          go install github.com/go-python/gopy@v0.4.10
          go install golang.org/x/tools/cmd/goimports@v0.16.0

      - name: Configure macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: "cp314-macosx_arm64"
          CIBW_ARCHS: "arm64"
          CIBW_ENVIRONMENT: "PATH=$PATH:$HOME/go/bin RELEASE_VERSION=${RELEASE_VERSION}"
          CIBW_ENVIRONMENT_PASS_MACOS: "RELEASE_VERSION SDKROOT"
          CIBW_TEST_COMMAND: >-
            python -c "from py_excel_form_extractor import extractor, utils;
            assert extractor.CellRange(); assert extractor.SearchCriteria()"
          CIBW_BEFORE_BUILD: |
            pip install pybindgen
          # CIBW_BUILD_VERBOSITY: 3 # Add verbose output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: ./wheelhouse/*.whl

  publish:
    name: Publish PyPI
    needs: [build_linux_x86_64, build_linux_arm, build_macos_arm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/champion-excel-form-extractor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Collect all wheels
        run: |
          ls -R
          mkdir dist
          for f in $(find . -type f -name '*.whl'); do mv ${f} dist; done;
          ls -R dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist
          print-hash: true
