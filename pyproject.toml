[project]
name = "champion-excel-form-extractor"
dynamic = ["version", "keywords"]
description = "Extract excel form content into structured data"
authors = [
    {name = "Anurag Dhadse", email = "hello@adhadse.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]


[build-system]
requires = [
    "setuptools>=80",
    "Cython>=3.1",
    "wheel>=0.45",
    "pybindgen>=0.22.1"
]

build-backend = "setuptools.build_meta"
